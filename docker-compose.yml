version: '3.8'
services:
  mcp-server:
    build: ./mcp_server
    ports:
      - "8000:8000"
    restart: unless-stopped

  mcp-agent:
    build: ./agent
    image: fastmcpagent:latest
    environment:
      - MCP_URL=http://mcp-server:8000
    depends_on:
      - mcp-server
    ports:
      - "8501:8501"
    restart: unless-stopped
